<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 Days of Rooted Healing — Tree of Healing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --w1:#3D6B4A;--w1s:#6A9F5E;--w1a:#5D8A52;--w1w:rgba(61,107,74,0.07);--w1bg:#EFF6ED;
  --w2:#76593A;--w2s:#A07B52;--w2a:#8A6946;--w2w:rgba(118,89,58,0.07);--w2bg:#F6F1EA;
  --w3:#8A7230;--w3s:#B09740;--w3a:#9A8238;--w3w:rgba(138,114,48,0.07);--w3bg:#F8F4EA;
  --w4:#3A6B78;--w4s:#5A8F9C;--w4a:#4A7B88;--w4w:rgba(58,107,120,0.07);--w4bg:#ECF3F6;
  --w5:#6B4A5A;--w5s:#957080;--w5a:#7E5A6A;--w5w:rgba(107,74,90,0.07);--w5bg:#F4EDF1;
  --p:#3D6B4A;--ps:#6A9F5E;--pa:#5D8A52;--pw:rgba(61,107,74,0.07);--pbg:#EFF6ED;
  --earth:#2A2016;--bark:#4E3628;--bark2:#584030;
  --cream:#F9F6F1;--parch:#F0EAE0;--linen:#DDD7CC;
  --gold:#6E5A20;--gold2:#8A7230;--goldw:#F5F0E0;
  --txt:#302A22;--txt2:#4A4238;--txt3:#635B50;--wht:#FFF;
  --red:#9B4040;--redw:rgba(155,64,64,0.07);
  --fd:'Playfair Display',Georgia,serif;--fb:'EB Garamond',Georgia,serif;--fu:'Outfit',system-ui,sans-serif;
  --r:10px;--rl:20px;--rx:28px;
  --sh:0 4px 24px rgba(42,32,22,0.08);--shl:0 8px 40px rgba(42,32,22,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;scroll-behavior:smooth;}
body{font-family:var(--fb);background:var(--cream);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.22;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");}

/* === SHARED === */
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fu{animation:fu .4s ease forwards}
.fd1{animation-delay:.05s;opacity:0}.fd2{animation-delay:.1s;opacity:0}.fd3{animation-delay:.15s;opacity:0}.fd4{animation-delay:.2s;opacity:0}.fd5{animation-delay:.25s;opacity:0}.fd6{animation-delay:.3s;opacity:0}.fd7{animation-delay:.35s;opacity:0}
@keyframes leafFall{0%{transform:translateY(-20px) rotate(0);opacity:0}8%{opacity:.7}92%{opacity:.7}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
.fl{position:absolute;opacity:0;animation:leafFall linear infinite;pointer-events:none;z-index:0;font-size:22px}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 80px}

/* === NAV === */
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(249,246,241,.9);border-bottom:1px solid rgba(221,215,204,.6)}
.nav-in{max-width:960px;margin:0 auto;display:flex;align-items:center;height:52px;padding:0 20px;gap:12px}
.nav-b{font-family:var(--fd);font-size:17px;font-weight:400;color:var(--p);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav-tabs{display:flex;gap:2px;margin-left:auto;background:var(--parch);border-radius:100px;padding:3px}
.nav-tab{font-family:var(--fu);font-size:11px;font-weight:500;padding:6px 14px;border-radius:100px;border:none;background:transparent;color:var(--txt2);cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-tab:hover{color:var(--txt)}.nav-tab.a{background:var(--p);color:var(--wht)}
.nav-bk{font-family:var(--fu);font-size:12px;color:var(--p);background:none;border:none;cursor:pointer;padding:4px 8px;margin-left:auto}
.mob-sel{display:none;margin-left:auto}
@media(max-width:700px){.nav-tabs{display:none}.mob-sel{display:block}.mob-sel select{font-family:var(--fu);font-size:12px;padding:5px 8px;border:1px solid var(--linen);border-radius:var(--r);background:var(--wht);color:var(--txt)}}

/* === PROGRESS BAR === */
.pbar-w{max-width:960px;margin:0 auto;padding:20px 20px 0}
.pbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pbar-l{font-family:var(--fu);font-size:12px;font-weight:500;color:var(--txt2)}
.pbar-p{font-family:var(--fu);font-size:20px;font-weight:700;color:var(--p)}
.pbar{height:8px;background:var(--linen);border-radius:8px;overflow:hidden}
.pbar-f{height:100%;border-radius:8px;transition:width .6s;background:linear-gradient(90deg,var(--p),var(--ps))}
.pbar-marks{display:flex;justify-content:space-between;margin-top:6px}
.pbar-m{font-family:var(--fu);font-size:10px;color:var(--txt3)}.pbar-m.dn{color:var(--p);font-weight:600}

/* === ONBOARDING === */
.ob{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;position:relative;overflow:hidden;background:linear-gradient(170deg,var(--w1bg) 0%,var(--cream) 40%,var(--goldw) 100%)}
.ob::before{content:'';position:absolute;inset:-200px;background:radial-gradient(ellipse at 25% 25%,rgba(61,107,74,.08),transparent 55%),radial-gradient(ellipse at 75% 75%,rgba(138,114,48,.05),transparent 50%);pointer-events:none}
.obi{position:relative;z-index:1;max-width:520px;width:100%;text-align:center}
.obs{display:none}.obs.a{display:block;animation:fu .45s ease}
.ob-logo{font-family:var(--fu);font-size:12px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--p);margin-bottom:28px}
.ob-t{font-family:var(--fd);font-size:clamp(36px,7vw,56px);font-weight:300;color:var(--earth);line-height:1.1;margin-bottom:6px}
.ob-t em{font-style:italic;color:var(--p);font-weight:400}
.ob-st{font-family:var(--fd);font-size:clamp(15px,2.5vw,20px);font-weight:300;font-style:italic;color:var(--bark2);margin-bottom:6px}
.ob-hw{font-family:var(--fu);font-size:13px;font-weight:500;color:var(--txt2);margin-bottom:6px;background:var(--pw);display:inline-block;padding:6px 18px;border-radius:100px}
.ob-by{font-family:var(--fu);font-size:11px;color:var(--txt3);letter-spacing:2px;margin-bottom:36px}
.ob-v{font-family:var(--fd);font-size:16px;font-style:italic;color:var(--bark2);line-height:1.8;max-width:420px;margin:0 auto 6px}
.ob-r{font-family:var(--fu);font-size:10px;color:var(--txt3);letter-spacing:3px;margin-bottom:36px}
.ob-q{font-family:var(--fd);font-size:26px;font-weight:400;color:var(--earth);margin-bottom:6px}
.ob-qs{font-family:var(--fb);font-size:15px;color:var(--txt2);margin-bottom:24px;line-height:1.7}
.ob-in{width:100%;max-width:340px;padding:14px 18px;border:2px solid var(--linen);border-radius:var(--r);font-family:var(--fb);font-size:18px;color:var(--txt);background:var(--wht);outline:none;text-align:center;transition:border-color .3s}
.ob-in:focus{border-color:var(--p)}
.ob-ta{width:100%;max-width:400px;min-height:100px;padding:14px 18px;border:2px solid var(--linen);border-radius:var(--r);font-family:var(--fb);font-size:15px;color:var(--txt);background:var(--wht);outline:none;resize:vertical;line-height:1.7;transition:border-color .3s}
.ob-ta:focus{border-color:var(--p)}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;text-align:left}
.ac{background:var(--wht);border:2px solid var(--linen);border-radius:var(--rl);padding:20px 18px;cursor:pointer;transition:all .25s;position:relative}
.ac:hover{border-color:var(--ps);transform:translateY(-2px);box-shadow:var(--sh)}
.ac.sel{border-color:var(--p);background:var(--pw)}
.ac.sel::after{content:'\u2713';position:absolute;top:10px;right:12px;width:22px;height:22px;background:var(--p);color:var(--wht);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ac-i{font-size:28px;margin-bottom:6px}.ac-n{font-family:var(--fu);font-size:15px;font-weight:600;color:var(--earth);margin-bottom:3px}.ac-d{font-family:var(--fu);font-size:11px;color:var(--txt2);line-height:1.4}
.sf{display:flex;gap:10px;margin-bottom:28px;justify-content:center;flex-wrap:wrap}
.sf-b{font-family:var(--fu);font-size:13px;font-weight:500;padding:10px 22px;border-radius:100px;border:2px solid var(--linen);background:var(--wht);color:var(--txt2);cursor:pointer;transition:all .2s}
.sf-b:hover{border-color:var(--ps)}.sf-b.sel{border-color:var(--p);background:var(--p);color:var(--wht)}
.btn{font-family:var(--fu);font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding:16px 48px;border-radius:100px;border:none;cursor:pointer;transition:all .3s;margin-top:20px}
.btn-p{background:var(--p);color:var(--wht);box-shadow:0 4px 20px rgba(61,107,74,.3)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(61,107,74,.4)}
.btn-s{background:transparent;color:var(--txt3);border:1px solid var(--linen);padding:10px 28px;font-size:11px;margin-top:10px}
.ob-dots{display:flex;gap:7px;justify-content:center;margin-top:28px}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--linen);transition:all .3s}.ob-dot.a{background:var(--p);width:22px;border-radius:4px}

/* === WEEK 0 / PSYCHOEDUCATION === */
.w0{max-width:680px;margin:0 auto;padding:40px 20px 60px}
.w0-hero{text-align:center;margin-bottom:40px}
.w0-tag{font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--p);margin-bottom:8px}
.w0-title{font-family:var(--fd);font-size:clamp(28px,5vw,40px);font-weight:300;color:var(--earth);margin-bottom:8px}
.w0-sub{font-family:var(--fd);font-size:17px;font-style:italic;color:var(--bark2)}
.w0-sec{margin-bottom:36px}
.w0-sec-t{font-family:var(--fd);font-size:24px;font-weight:500;color:var(--earth);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.w0-sec-b{font-family:var(--fb);font-size:16px;color:var(--txt);line-height:2}
.w0-sec-b p{margin-bottom:14px}
.w0-card{background:var(--wht);border-radius:var(--rx);border:1px solid var(--linen);padding:24px;margin-bottom:16px}
.w0-card-t{font-family:var(--fu);font-size:14px;font-weight:600;color:var(--earth);margin-bottom:8px}
.w0-card-b{font-family:var(--fb);font-size:15px;color:var(--txt2);line-height:1.8}
.w0-ladder{display:flex;flex-direction:column;gap:0;margin:20px 0}
.w0-rung{padding:20px 24px;border-radius:var(--rl);text-align:center;font-family:var(--fu);font-size:13px;font-weight:500;line-height:1.6}
.w0-rung-t{font-size:16px;font-weight:700;margin-bottom:4px;font-family:var(--fd)}
.w0-rung-arrow{text-align:center;font-size:20px;color:var(--linen);margin:4px 0}

/* === WEEK HERO === */
.wh{position:relative;overflow:hidden;padding:48px 20px 36px;text-align:center;transition:background .4s}
.wh::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,var(--pw),transparent 70%);pointer-events:none}
.wh-gr{font-family:var(--fd);font-size:15px;font-style:italic;color:var(--p);position:relative;z-index:1;margin-bottom:8px}
.wh-int{font-family:var(--fb);font-size:14px;font-style:italic;color:var(--txt3);max-width:380px;margin:0 auto 14px;position:relative;z-index:1}
.wh-tag{font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--p);position:relative;z-index:1;margin-bottom:8px}
.wh-t{font-family:var(--fd);font-size:clamp(30px,5.5vw,46px);font-weight:300;color:var(--earth);position:relative;z-index:1;margin-bottom:4px;line-height:1.15}
.wh-th{font-family:var(--fd);font-size:clamp(15px,2.5vw,19px);font-style:italic;font-weight:300;color:var(--bark2);position:relative;z-index:1;margin-bottom:16px}
.wh-d{font-family:var(--fb);font-size:15px;color:var(--txt2);line-height:1.9;max-width:520px;margin:0 auto;position:relative;z-index:1}
.wh-sess{display:inline-block;font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:1px;padding:6px 16px;border-radius:100px;margin-top:14px;position:relative;z-index:1;background:var(--goldw);color:var(--gold);border:1px solid rgba(138,114,48,.15)}

/* === TODAY BANNER === */
.today-ban{max-width:960px;margin:16px auto 0;padding:0 20px}
.today-ban-inner{background:var(--pw);border:1px solid var(--pa);border-radius:var(--rl);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.today-ban-txt{font-family:var(--fu);font-size:14px;font-weight:500;color:var(--p)}
.today-ban-txt span{font-weight:300;color:var(--txt2)}
.today-ban-btn{font-family:var(--fu);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:10px 28px;border-radius:100px;border:none;background:var(--p);color:var(--wht);cursor:pointer;transition:all .2s}
.today-ban-btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}

/* === MOOD TIMELINE === */
.mood-tl{max-width:960px;margin:20px auto 0;padding:0 20px}
.mood-tl-inner{background:var(--wht);border:1px solid var(--linen);border-radius:var(--rl);padding:20px 24px;overflow-x:auto}
.mood-tl-t{font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--txt2);margin-bottom:12px}
.mood-dots{display:flex;gap:4px;align-items:end;min-width:max-content}
.mood-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--linen);background:var(--cream);flex-shrink:0;position:relative}
.mood-dot.filled{border-color:transparent}
.mood-dot-num{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-family:var(--fu);font-size:9px;color:var(--txt2);font-weight:500}

/* === DAY CARDS === */
.gw{max-width:960px;margin:0 auto 20px;padding:0 20px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.dc{background:var(--wht);border-radius:var(--rx);border:1px solid var(--linen);cursor:pointer;transition:all .3s;overflow:hidden;position:relative}
.dc:hover{transform:translateY(-3px);box-shadow:var(--shl);border-color:var(--pa)}
.dc.done .dc-ck{opacity:1;transform:scale(1)}
.dc.session{border-color:var(--gold2);border-width:2px}
.dc.locked{opacity:.5;pointer-events:none}
.dc-top{position:relative}.dc-wave{display:block;width:100%;height:36px}
.dc-ck{position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--p);color:var(--wht);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;opacity:0;transform:scale(.5);transition:all .3s;z-index:2}
.dc-sb{position:absolute;top:10px;left:12px;font-family:var(--fu);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:100px;background:var(--gold);color:var(--wht);z-index:2}
.dc-body{padding:16px 20px 20px}
.dc-num{font-family:var(--fu);font-size:10px;font-weight:600;letter-spacing:3px;color:var(--p);text-transform:uppercase;margin-bottom:3px}
.dc-title{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--earth);margin-bottom:8px;line-height:1.25}
.dc-verse{font-family:var(--fb);font-size:13px;font-style:italic;color:var(--bark2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.dc-ref{font-family:var(--fu);font-size:10px;color:var(--txt3);letter-spacing:1.5px}
.dc-tags{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.dc-tag{font-family:var(--fu);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:100px;border:1px solid var(--pa);color:var(--p);background:var(--pw)}

/* === GROUP DISCUSSION === */
.grp{max-width:960px;margin:0 auto 20px;padding:0 20px}
.grp-inner{background:var(--goldw);border:1px solid rgba(138,114,48,.12);border-radius:var(--rl);padding:24px}
.grp-t{font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.grp-title{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--earth);margin-bottom:14px}
.grp-q{font-family:var(--fb);font-size:15px;color:var(--txt);line-height:1.8;margin-bottom:10px;padding-left:16px;border-left:3px solid var(--gold2)}

/* === SESSION REVIEW === */
.rev-card{background:var(--wht);border-radius:var(--rx);border:1px solid var(--linen);padding:24px;margin-bottom:20px}
.rev-card-t{font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--p);margin-bottom:12px}
.rev-stat{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.rev-stat-item{text-align:center;flex:1;min-width:80px}
.rev-stat-n{font-family:var(--fu);font-size:28px;font-weight:700;color:var(--p)}
.rev-stat-l{font-family:var(--fu);font-size:10px;color:var(--txt3);letter-spacing:1px;text-transform:uppercase}
.rev-moods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.rev-mood{font-size:20px;background:var(--pw);border-radius:var(--r);padding:6px 10px;display:flex;align-items:center;gap:6px;font-family:var(--fu);font-size:12px;color:var(--txt)}
.rev-journal{background:var(--parch);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rev-journal-d{font-family:var(--fu);font-size:10px;font-weight:600;color:var(--p);letter-spacing:1px;margin-bottom:4px}
.rev-journal-t{font-family:var(--fb);font-size:14px;font-style:italic;color:var(--bark2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rev-notes{background:var(--goldw);border-radius:var(--r);padding:16px}
.rev-notes-t{font-family:var(--fu);font-size:10px;font-weight:600;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
.rev-notes-b{font-family:var(--fb);font-size:14px;color:var(--txt);line-height:1.7}

/* === DAY DETAIL === */
.det{max-width:680px;margin:0 auto;padding:32px 20px 80px}
.det-bk{font-family:var(--fu);font-size:12px;font-weight:500;color:var(--p);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:24px;padding:6px 0}
.det-num{font-family:var(--fd);font-size:clamp(64px,10vw,88px);font-weight:300;background:linear-gradient(180deg,var(--pa),transparent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:-10px}
.det-title{font-family:var(--fd);font-size:clamp(28px,4.5vw,38px);font-weight:400;color:var(--earth);position:relative;z-index:1;margin-bottom:8px}
.det-hw{font-family:var(--fu);font-size:11px;font-weight:500;color:var(--p);background:var(--pw);display:inline-block;padding:4px 14px;border-radius:100px;margin-bottom:24px}

/* Trauma warning */
.tw{background:var(--redw);border:1px solid rgba(155,64,64,.15);border-radius:var(--rx);padding:20px 24px;margin-bottom:24px}
.tw-t{font-family:var(--fu);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.tw-b{font-family:var(--fb);font-size:14px;color:var(--txt);line-height:1.8}

/* Pause button */
.pause-btn{position:fixed;bottom:20px;left:20px;z-index:90;font-family:var(--fu);font-size:11px;font-weight:600;padding:10px 18px;border-radius:100px;border:1px solid var(--linen);background:var(--wht);color:var(--txt2);cursor:pointer;box-shadow:var(--sh);transition:all .2s;display:flex;align-items:center;gap:6px}

/* Mood */

.gate{position:fixed;inset:0;background:rgba(42,32,22,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}

.proof-a{font-family:var(--fu);font-size:12px;color:var(--txt2);white-space:nowrap}

.gate-t{font-family:var(--fd);font-size:28px;color:var(--earth);margin-bottom:8px}
.gate-s{font-family:var(--fb);font-size:15px;color:var(--txt2);line-height:1.8;margin-bottom:20px}
.gate-features{text-align:left;margin:0 auto 24px;max-width:340px}
.gate-feat{font-family:var(--fu);font-size:13px;color:var(--txt);padding:8px 0;border-bottom:1px solid var(--linen);display:flex;align-items:center;gap:10px}
.gate-feat:last-child{border:none}
.gate-in{width:100%;padding:14px 18px;border:2px solid var(--linen);border-radius:var(--r);font-family:var(--fu);font-size:15px;color:var(--txt);background:var(--wht);outline:none;margin-bottom:12px}
.gate-in:focus{border-color:var(--p)}
.gate-or{font-family:var(--fu);font-size:12px;color:var(--txt3);margin:16px 0;display:flex;align-items:center;gap:12px}
.gate-or::before,.gate-or::after{content:'';flex:1;height:1px;background:var(--linen)}
.pr-w{position:fixed;bottom:20px;right:20px;z-index:90;cursor:pointer;transition:transform .3s}
.pr-w:hover{transform:scale(1.08)}.pr{width:52px;height:52px;position:relative}

.pr-fl{fill:none;stroke:var(--p);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s}
.pr-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fu);font-size:12px;font-weight:700;color:var(--p)}

/* Overlay */
.celeb{position:fixed;inset:0;background:rgba(42,32,22,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.celeb-inner{background:var(--cream);border-radius:var(--rx);padding:44px 32px;max-width:460px;text-align:center;box-shadow:var(--shl);animation:fu .5s ease}

{day:2,week:1,title:"The Soil of Honesty",verse:"Then you will know the truth, and the truth will set you free.",ref:"John 8:32",teaching:"Honesty is the soil where healing grows. Not polished answers\u2014raw truth about where we actually are.\n\nYou cannot heal what you will not name.",ex:{walking:{t:"Bare Ground Walk",b:"Find bare earth. Touch it. Walk fifteen minutes noticing every place raw ground is visible.",d:"15 min"},hiking:{t:"Off-Trail Ground",b:"Step off the groomed trail onto raw ground. Feel the difference underfoot.",d:"20 min"},biking:{t:"The Unpaved Road",b:"Find a dirt road. Ride slowly. Feel every bump and rut.",d:"20 min"},yoga:{t:"Mountain Pose Truth",b:"Tadasana barefoot on earth. Eyes closed. Three minutes. Then Uttanasana\u2014surrender to what\u2019s true.",d:"10 min"}},journalPrompt:"If I were completely honest\u2014no audience\u2014what would I say about how I\u2019m doing?",reflection:"What truth have I been avoiding?",prayer:"Father, give me courage to stop performing wellness and start pursuing it. Amen.",tags:["Honesty","Vulnerability"]},
{day:3,week:1,title:"Roots Go Deep in Drought",verse:"They will be like a tree planted by the water that sends out its roots by the stream.",ref:"Jeremiah 17:7\u20138",teaching:"In botany, roots grow deepest during drought. Your hardest seasons may be driving your roots deeper into God.\n\nSomething invisible and essential is happening underground.",ex:{walking:{t:"Root Discovery Walk",b:"Find a tree. Sit at its base. Follow the roots with your eyes. Walk among trees seeing root systems, not trunks.",d:"15 min"},hiking:{t:"Exposed Root Trail",b:"Hike until you find exposed roots. Trace them with your hand. Forced to the surface by adversity.",d:"30 min"},biking:{t:"Treeline Ride",b:"Ride along a tree line. Notice how edge trees grow wider, sturdier. Adversity shaped them.",d:"20 min"},yoga:{t:"Tree Pose",b:"Vrksasana near a tree. Root through your standing foot. Arms overhead. When you wobble\u2014that\u2019s growth.",d:"10 min"}},journalPrompt:"What drought am I in? Where might roots be growing that I can\u2019t see?",reflection:"Can I name a past hard season that deepened something essential?",prayer:"God, I trust You are the living water my roots are reaching for. Amen.",tags:["Resilience","Trust"]},
{day:4,week:1,title:"Fearfully and Wonderfully Made",verse:"I praise you because I am fearfully and wonderfully made.",ref:"Psalm 139:14",teaching:"Somewhere we stopped believing this applies to us. Today is a reclamation\u2014not affirmation, but theological fact.\n\nThe parts of you that you\u2019ve been apologizing for? Those aren\u2019t bugs. They\u2019re features.",ex:{walking:{t:"Uniqueness Study",b:"Study a leaf for five minutes. Every imperfection defines it. Walk collecting unique specimens.",d:"15 min"},hiking:{t:"Wonder Trail",b:"Hike stopping every time something surprises you. Collect ten moments of wonder.",d:"30 min"},biking:{t:"Panorama Ride",b:"Ride to the highest point. Look out. All of this was spoken into being\u2014so were you.",d:"25 min"},yoga:{t:"Self-Compassion Flow",b:"Child\u2019s Pose \u2192 Cat-Cow \u2192 Cobra \u2192 Child\u2019s Pose. Three cycles. Each one: \u2018I am wonderfully made.\u2019",d:"12 min"}},journalPrompt:"What part of myself have I been apologizing for that might be by design?",reflection:"If I truly believed I was wonderfully made, what would change?",prayer:"Creator, forgive me for criticizing Your work. Amen.",tags:["Identity","Self-Worth"]},
{day:5,week:1,title:"The Ministry of Walking",verse:"This is the way; walk in it.",ref:"Isaiah 30:21",teaching:"Jesus did His most important work while walking. In Walk and Talk therapy, moving forward physically unlocks what sitting still cannot.\n\nToday we move as prayer. As therapy. As trust.",ex:{walking:{t:"Prayer Walk",b:"Twenty minutes. No earbuds. Pace matches breathing. Talk to God like someone beside you.",d:"20 min"},hiking:{t:"Trail Conversation",b:"Hike and pray out loud. The trail is your prayer closet.",d:"30 min"},biking:{t:"Prayer Loop",b:"Each landmark: a specific prayer. Mailbox: home. School: children. Church: community.",d:"25 min"},yoga:{t:"Walking Meditation",b:"Slow walking: heel, ball, toes. Ten steps forward, turn, ten back. Each step is a prayer.",d:"15 min"}},journalPrompt:"What do I notice about my thoughts when moving versus sitting?",reflection:"When I walk, where do my thoughts go?",prayer:"Lord, walk beside me. Step for step. Amen.",tags:["Movement","Prayer"]},
{day:6,week:1,title:"Sacred Silence",verse:"Let all the earth be silent before him.",ref:"Habakkuk 2:20",teaching:"Silence is where God does His deepest work. Elijah found God not in the earthquake but the still, small voice.\n\nSilence isn\u2019t emptiness. It\u2019s fullness waiting to be heard.",ex:{walking:{t:"Listening Walk",b:"Fifteen minutes in the quietest place. No talking, no music. Count distinct sounds.",d:"15 min"},hiking:{t:"Summit Silence",b:"Hike to a high point. Sit in complete silence ten minutes. Just listen.",d:"30 min"},biking:{t:"Coasting Quiet",b:"Find a downhill. Stop pedaling and coast in silence. Then stop and sit ten minutes.",d:"20 min"},yoga:{t:"Silence Savasana",b:"Lie outdoors fifteen minutes. Eyes closed. Don\u2019t try to hear God\u2014just listen.",d:"15 min"}},journalPrompt:"What am I most afraid of hearing in the silence?",reflection:"How much noise in my life is chosen versus avoidance?",prayer:"God of the still small voice, give me ears for what only silence reveals. Amen.",tags:["Silence","Listening"]},
{day:7,week:1,title:"Sabbath Rest",verse:"Come to me, all you who are weary, and I will give you rest.",ref:"Matthew 11:28",teaching:"God didn\u2019t suggest rest\u2014He commanded it. This is your week-one Sabbath: I am more than what I produce.\n\nBring your journal to Michelle. Share what surfaced\u2014what surprised you, what hurt, what gave hope.",ex:{walking:{t:"Aimless Wander",b:"No destination, no step count. Wander. This is obedience, not laziness.",d:"Free"},hiking:{t:"Hammock Hike",b:"Hike to a beautiful spot and just be there. No timer. The trail will wait.",d:"Free"},biking:{t:"Sunset Cruise",b:"Ride slowly at golden hour. No goals. When you find the spot, watch the sunset all the way down.",d:"Free"},yoga:{t:"Restorative Rest",b:"Supported Child\u2019s Pose: 5 min. Legs Up Wall: 5 min. Savasana: 10. No effort.",d:"20 min"}},journalPrompt:"Why is rest so hard for me?",reflection:"What if rest were holy instead of lazy?",prayer:"Jesus, I\u2019m tired\u2014the deep kind. Let me rest in You. Amen.",tags:["Rest","Sabbath"]},
{day:8,week:2,title:"Name the Weight",verse:"Cast all your anxiety on him because he cares for you.",ref:"1 Peter 5:7",teaching:"You can\u2019t cast what you haven\u2019t named. Today we take inventory. A weight named is a weight that can be moved.\n\nPeter doesn\u2019t say manage. He says cast. Throw it.",ex:{walking:{t:"Stone Inventory",b:"Gather stones\u2014one per burden. Hold them all. Name each. Walk and set them down one by one.",d:"20 min"},hiking:{t:"Pack Weight Release",b:"Extra weight in your pack. Hike uphill. At the top, remove it. Hike back light.",d:"30 min"},biking:{t:"Headwind & Tailwind",b:"Ride into the wind naming burdens. Turn around. Feel the tailwind\u2014that\u2019s casting.",d:"20 min"},yoga:{t:"Letting Go Flow",b:"Standing, fists clenched. Name burdens. Forward Fold\u2014release grip. Each exhale, open fingers.",d:"12 min"}},journalPrompt:"Name every stone you\u2019re carrying.",reflection:"Which burdens are mine\u2014and which did I pick up from habit or guilt?",prayer:"Father, my hands have cramped around these. Help me let go. Amen.",tags:["Anxiety","Release"]},
{day:9,week:2,title:"The Grief You Buried",verse:"He heals the brokenhearted and binds up their wounds.",ref:"Psalm 147:3",teaching:"Buried grief doesn\u2019t decompose\u2014it fossilizes. That loss you never mourned is taking up space healing needs.\n\nTo grieve is to honor what mattered.",ex:{walking:{t:"Water\u2019s Edge Walk",b:"Walk near moving water. Sit fifteen minutes. If tears come, let them. They\u2019re water too.",d:"20 min"},hiking:{t:"Waterfall Pilgrimage",b:"Hike to moving water. Stand in the mist. Water moves. Grief must too.",d:"45 min"},biking:{t:"River Trail Ride",b:"Ride alongside a river. Match its pace. It carries everything downstream without holding on.",d:"25 min"},yoga:{t:"Heart-Opening Release",b:"Camel Pose one minute. Child\u2019s Pose. Repeat three times. Heart opens, then rests.",d:"12 min"}},journalPrompt:"What grief have I never fully allowed myself to feel?",reflection:"What if I gave myself permission to grieve without a timeline?",prayer:"Healer of the brokenhearted, bind up what\u2019s broken. Amen.",tags:["Grief","Loss"]},
{day:10,week:2,title:"Releasing Control",verse:"Trust in the Lord with all your heart.",ref:"Proverbs 3:5\u20136",teaching:"Control is the illusion that keeps anxious people sane\u2014until it doesn\u2019t. The thing you\u2019re gripping hardest is usually what you most need to release.",ex:{walking:{t:"Unplanned Walk",b:"At every intersection, let impulse decide. Surrender the plan.",d:"20 min"},hiking:{t:"Follow the Water",b:"Follow a creek, not the trail. You can\u2019t control where it goes.",d:"30 min"},biking:{t:"No-Map Ride",b:"No GPS. Take unknown turns. Notice how your body reacts to not knowing.",d:"25 min"},yoga:{t:"Surrender Flow",b:"Seated forward fold: reach, then stop. Let gravity pull you. Three minutes.",d:"10 min"}},journalPrompt:"What am I gripping so tightly my hands have gone numb?",reflection:"If I trusted God with the outcome, what decision would change?",prayer:"Lord, pry my fingers open. I choose trust. Amen.",tags:["Control","Surrender"]},
{day:11,week:2,title:"Forgiving the Unforgivable",verse:"Forgive as the Lord forgave you.",ref:"Colossians 3:13",teaching:"Forgiveness is not saying it was okay. It\u2019s refusing to let someone\u2019s actions hold your peace hostage.\n\nUnforgiveness is drinking poison waiting for the other person to die.",ex:{walking:{t:"Thorn Garden Walk",b:"Find a thorny plant. Thorns exist alongside beauty. Walk noticing both\u2014they coexist.",d:"15 min"},hiking:{t:"Obstacle Trail",b:"Hike through obstacles\u2014fallen trees, rocks, mud. Navigate around them. None stop you.",d:"30 min"},biking:{t:"Pothole Perspective",b:"Rough road. Every crack: something that hurt. You can curse each one or learn to navigate.",d:"20 min"},yoga:{t:"Hip-Opening Release",b:"Pigeon Pose three minutes per side. Hips store pain. Breathe out the name of whoever you need to release.",d:"12 min"}},journalPrompt:"Who am I still angry at? What if I set that anger down\u2014for me?",reflection:"Is there a difference between forgiving and trusting again?",prayer:"God, I\u2019m willing to be made willing. Start there. Amen.",tags:["Forgiveness","Freedom"]},
{day:12,week:2,title:"Shame Has No Roots Here",verse:"There is now no condemnation for those in Christ Jesus.",ref:"Romans 8:1",teaching:"Guilt says \u2018I did bad.\u2019 Shame says \u2018I am bad.\u2019 Shame is a parasite\u2014it thrives hidden but can\u2019t survive light.\n\nToday we drag it into the open.",ex:{walking:{t:"Turning Over Stones",b:"Turn over stones. Things in darkness scatter in light. Walk turning stones, watching light flood in.",d:"15 min"},hiking:{t:"Dark to Light Hike",b:"Hike from dense shade into an open clearing. Feel the transition. Shame can\u2019t survive light.",d:"30 min"},biking:{t:"Shadow to Sun Ride",b:"Ride through shade and sun. Each time you emerge into sunlight, name a shame-story.",d:"20 min"},yoga:{t:"Heart Opener in Light",b:"Sunny spot. Bolster under spine. Arms out. Let sun hit your chest. Ten minutes.",d:"10 min"}},journalPrompt:"What story has shame told me? Write it\u2014then write the truth underneath.",reflection:"If shame had a voice, whose voice is it?",prayer:"Jesus, no condemnation. Help me believe it where shame still lives. Amen.",tags:["Shame","Grace"]},
{day:13,week:2,title:"The Boundary is Holy Ground",verse:"Above all else, guard your heart.",ref:"Proverbs 4:23",teaching:"Boundaries are sacred. God sets them: light/dark, sea/land. Jesus said no. He withdrew. He left when it was time.\n\nA boundary is a fence built in wisdom, not a wall built in anger.",ex:{walking:{t:"Fence Line Walk",b:"Walk along a boundary in nature. It doesn\u2019t apologize. Everything on both sides benefits.",d:"15 min"},hiking:{t:"Ridge Walk",b:"Hike a ridge line\u2014boundary between two valleys. It defines both without choosing one.",d:"30 min"},biking:{t:"Property Line Ride",b:"Ride along fences, hedgerows. Clear boundaries create peaceful coexistence.",d:"20 min"},yoga:{t:"Warrior Boundaries",b:"Warrior I, II, III\u2014one minute each. Warriors are boundaried. Your body IS the boundary.",d:"12 min"}},journalPrompt:"Where am I saying yes when my soul screams no?",reflection:"What would change if I set one clear, kind boundary?",prayer:"God, help me build fences with love. Amen.",tags:["Boundaries","Wisdom"]},
{day:14,week:2,title:"The Altar of Letting Go",verse:"See, I am doing a new thing!",ref:"Isaiah 43:18\u201319",teaching:"Your week-two Sabbath\u2014a day of altar building. You\u2019ve done extraordinary work.\n\nBring your journal to Michelle. This week\u2019s work is some of the hardest you\u2019ll ever do.",ex:{walking:{t:"Build a Cairn",b:"Stack stones. Each one: something released. Leave it there.",d:"15 min"},hiking:{t:"Summit Altar",b:"Hike high. Build a stone altar. Name each stone. Leave it visible only to God.",d:"45 min"},biking:{t:"End-of-Road Offering",b:"Ride to a dead end. You\u2019ve reached the end of carrying this. Turn back lighter.",d:"25 min"},yoga:{t:"Altar Flow",b:"Seven Sun Salutations. Each: one thing released. By the seventh, hands rise empty.",d:"15 min"}},journalPrompt:"What have I released this week?",reflection:"What new thing is springing up?",prayer:"God of new things, hold me to not picking it back up. Amen.",tags:["Release","New Beginnings"]},
{day:15,week:3,title:"The Uncomfortable Stretch",verse:"Testing produces perseverance.",ref:"James 1:2\u20133",teaching:"No one grows in comfort. The seed cracks open. Growth is not gentle\u2014but it is good.\n\nIf something feels uncomfortable, it might be growth happening.",ex:{walking:{t:"Uphill Walk",b:"Steepest hill near you. Don\u2019t stop. At the top, see how far you\u2019ve come.",d:"20 min"},hiking:{t:"Scramble Challenge",b:"Hands-and-feet scrambling. Push past comfort. Growth lives past \u2018I\u2019m not sure I can.\u2019",d:"40 min"},biking:{t:"Hill Repeats",b:"Hard hill, three times. Each burns more. Each makes you stronger.",d:"25 min"},yoga:{t:"Edge Poses",b:"Your hardest pose, twice as long. Chair: 2 min. Plank: 2 min. Shake. Grow.",d:"15 min"}},journalPrompt:"Where am I being stretched? What if it\u2019s growth, not failure?",reflection:"What would I attempt if discomfort were temporary but growth permanent?",prayer:"Lord, I trust the Gardener. Shape me. Amen.",tags:["Growth","Courage"]},
{day:16,week:3,title:"Joy is a Discipline",verse:"A cheerful heart is good medicine.",ref:"Proverbs 17:22",teaching:"Joy is not absence of pain\u2014it\u2019s something stronger. Neuroscience calls it positive neuroplasticity\u2014training your brain to notice good moments.",ex:{walking:{t:"Joy Scavenger Hunt",b:"Find: something beautiful, funny, surprising, fragrant, and alive smaller than your thumb.",d:"20 min"},hiking:{t:"Delight Trail",b:"Stop every time something delights you. Collect ten moments.",d:"30 min"},biking:{t:"Grin Ride",b:"Favorite route, purely for joy. No metrics. When was the last time you did something for fun?",d:"25 min"},yoga:{t:"Laughing Yoga",b:"Force a laugh. Then another. Within sixty seconds it\u2019s real. Three minutes. Then Savasana.",d:"10 min"}},journalPrompt:"What made me smile this week? Three moments.",reflection:"Is joy something that happens to me, or something I cultivate?",prayer:"Father, teach me stubborn, defiant joy. Amen.",tags:["Joy","Gratitude"]},
{day:17,week:3,title:"The Gift of Receiving",verse:"Every good gift is from above.",ref:"James 1:17",teaching:"Refusing to receive is a wall disguised as independence. God is a giver. If you won\u2019t receive, you\u2019re blocking grace.",ex:{walking:{t:"Open Hands Walk",b:"Walk palms up. Feel sun and wind landing on your hands. Receive it.",d:"15 min"},hiking:{t:"Trail Gift Collection",b:"Accept every gift the trail offers: shade, breeze, flat rock. Say \u2018thank you\u2019 out loud.",d:"30 min"},biking:{t:"Tailwind Gratitude",b:"Find a tailwind. Stop pedaling. Let it carry you without earning it.",d:"20 min"},yoga:{t:"Receiving Pose",b:"Supta Baddha Konasana. Arms open, palms up. Ten minutes.",d:"10 min"}},journalPrompt:"When someone offers help, what\u2019s my first instinct? Why?",reflection:"What gift has God been trying to give me?",prayer:"Open my hands. I need what You\u2019re offering. Amen.",tags:["Receiving","Grace"]},
{day:18,week:3,title:"Your Body Keeps the Score",verse:"Your bodies are temples of the Holy Spirit.",ref:"1 Corinthians 6:19",teaching:"Trauma lives in clenched jaws, tight shoulders, shallow breathing. Nature therapy works because it engages the body\u2014that IS the therapy.",ex:{walking:{t:"Body Scan Walk",b:"Walk slowly. Each step, scan a body part. Feet to crown. Where is tension?",d:"20 min"},hiking:{t:"Barefoot Section",b:"Safe section barefoot. Feel every rock, root, temperature change.",d:"20 min"},biking:{t:"Cadence Check",b:"Focus on body. Hands gripping? Relax. Shoulders hunched? Drop them.",d:"20 min"},yoga:{t:"Full Body Scan",b:"Lie down. Thirty seconds per region, toes to crown. Just notice.",d:"20 min"}},journalPrompt:"If my tension could speak, what would it say?",reflection:"How have I treated my body\u2014temple, tool, or burden?",prayer:"Holy Spirit, help me listen to what my body\u2019s telling me. Amen.",tags:["Body","Somatic"]},
{day:19,week:3,title:"Community is Not Optional",verse:"If either falls down, one can help the other up.",ref:"Ecclesiastes 4:9\u201310",teaching:"Isolation is depression\u2019s favorite tool. Even Jesus had twelve, had three, had one He loved most. You need people.",ex:{walking:{t:"Walk with Someone",b:"Invite one person. Not to vent\u2014just to walk side by side.",d:"20+ min"},hiking:{t:"Group Hike",b:"Invite two or three. Trail conversations happen that never happen across tables.",d:"60+ min"},biking:{t:"Buddy Ride",b:"Ride with someone at their pace. Side-by-side, facing forward, moving together.",d:"30+ min"},yoga:{t:"Partner Yoga",b:"Back-to-back. Feel each other breathe. Healing with another body is different.",d:"20 min"}},journalPrompt:"Who are my three? If I fell, who would help me up?",reflection:"Am I isolating from solitude or from hiding?",prayer:"God, bring safe people. Help me be safe. Amen.",tags:["Community","Connection"]},
{day:20,week:3,title:"Creativity as Worship",verse:"He has filled them with skill to do all kinds of work.",ref:"Exodus 35:35",teaching:"Creativity bypasses the analytical mind and goes straight to the soul. When words fail, art speaks.",ex:{walking:{t:"Nature Art Walk",b:"Collect materials. Arrange them into something. Don\u2019t plan it. Let your hands decide.",d:"25 min"},hiking:{t:"Trail Canvas",b:"Sketchbook or camera. Hike and create. The trail is your studio.",d:"40 min"},biking:{t:"Photo Essay Ride",b:"Photograph ten things. Arrange them in order. You told a story without words.",d:"25 min"},yoga:{t:"Intuitive Movement",b:"No poses. Move however your body wants. No wrong moves. Your body is creating art.",d:"15 min"}},journalPrompt:"When was the last time I made something just for joy?",reflection:"What creative expression has been dormant in me?",prayer:"Creator God, revive the creative spirit in me. Amen.",tags:["Creativity","Worship"]},
{day:21,week:3,title:"The Growing Edge",verse:"He who began a good work in you will carry it on to completion.",ref:"Philippians 1:6",teaching:"Three weeks. Twenty-one days. The growing edge is the tender tip of a branch\u2014new growth, vulnerable and fresh.\n\nBring your journal to Michelle. Show her how you\u2019ve changed.",ex:{walking:{t:"New Growth Hunt",b:"Find new growth: a sprout, a bud. Touch it gently. That\u2019s what you look like inside.",d:"15 min"},hiking:{t:"New Trail",b:"A trail you\u2019ve never hiked. Everything is new. This is your growing edge.",d:"40 min"},biking:{t:"New Road",b:"A route you\u2019ve never ridden. Growth always looks like unfamiliar territory.",d:"25 min"},yoga:{t:"New Pose",b:"A pose you\u2019ve never tried. You might wobble. That\u2019s the edge.",d:"15 min"}},journalPrompt:"How am I different than Day 1?",reflection:"What new growth do I want to protect?",prayer:"God, protect the new growth. Guard the tender places. Amen.",tags:["Progress","New Growth"]},
{day:22,week:4,title:"Purpose from the Ashes",verse:"In all things God works for the good of those who love him.",ref:"Romans 8:28",teaching:"Your pain is not wasted. The thing that broke you often qualifies you to help someone else. Wounded healers are the most effective.",ex:{walking:{t:"Regeneration Walk",b:"Find where fire or storm cleared land. Look for new growth from destruction.",d:"20 min"},hiking:{t:"Burn Zone Hike",b:"Hike through previously damaged area. Look for green. It\u2019s always there.",d:"40 min"},biking:{t:"Construction Zone",b:"Ride past something being rebuilt. Before demolition, it looked like destruction.",d:"20 min"},yoga:{t:"Phoenix Flow",b:"Child\u2019s Pose \u2192 Cat-Cow \u2192 Cobra \u2192 Standing. Five times. From surrender to rising.",d:"12 min"}},journalPrompt:"What has pain taught me that comfort never could?",reflection:"If my hardest experience became my purpose, what would it look like?",prayer:"God of redemption, make something beautiful from the ashes. Amen.",tags:["Purpose","Redemption"]},
{day:23,week:4,title:"Small Acts, Deep Roots",verse:"Whoever can be trusted with very little can be trusted with much.",ref:"Luke 16:10",teaching:"Most of God\u2019s work happens in the mundane. Faithfulness in small things is the training ground for large things.",ex:{walking:{t:"Service Walk",b:"One small caring act: pick up litter, pull a weed, leave a kind note. Don\u2019t tell anyone.",d:"20 min"},hiking:{t:"Trail Stewardship",b:"Maintain the trail. Move branches, pick up trash. Leave it better.",d:"30 min"},biking:{t:"Errand of Kindness",b:"Ride to do something for someone else. The bike makes it adventure. The act makes it ministry.",d:"25 min"},yoga:{t:"Metta Meditation",b:"Send loving-kindness: yourself, someone loved, someone neutral, someone difficult.",d:"12 min"}},journalPrompt:"What small act of kindness can I commit to this week?",reflection:"Am I waiting for a big calling while ignoring small ones?",prayer:"Lord, make me faithful in the small things. They ARE the big things. Amen.",tags:["Faithfulness","Service"]},
{day:24,week:4,title:"Gratitude Rewires the Brain",verse:"Give thanks in all circumstances.",ref:"1 Thessalonians 5:18",teaching:"Neuroscience confirms: gratitude increases dopamine and serotonin\u2014same neurotransmitters targeted by antidepressants.\n\nPaul says IN all circumstances, not FOR them.",ex:{walking:{t:"Gratitude Harvest",b:"Every minute, one gratitude out loud. Fifteen minutes, fifteen gratitudes.",d:"15 min"},hiking:{t:"Gratitude Summit",b:"At the top, write fifteen gratitudes in the dirt with a stick.",d:"40 min"},biking:{t:"Thankful Mile",b:"Every mile: three gratitudes. Five miles: fifteen doses of neurological medicine.",d:"25 min"},yoga:{t:"Gratitude Meditation",b:"Hands on heart. Each breath, one gratitude. Fifteen breaths.",d:"10 min"}},journalPrompt:"Fifteen specific, this-moment gratitudes.",reflection:"How does my body feel after gratitude versus scrolling the news?",prayer:"Father, thank You. For this breath. For the fact that I haven\u2019t given up. Amen.",tags:["Gratitude","Neuroscience"]},
{day:25,week:4,title:"Legacy Starts Now",verse:"A good person leaves an inheritance for their children\u2019s children.",ref:"Proverbs 13:22",teaching:"Every healed wound, every broken cycle\u2014that\u2019s legacy. Generational trauma travels through families. So does generational healing. You are the chain-breaker.",ex:{walking:{t:"Plant Something",b:"Plant a seed with your own hands. Legacy: putting something in the ground you may never see grown.",d:"20 min"},hiking:{t:"Trail Marker",b:"Build a cairn to guide the hiker after you. You\u2019ll never meet them. It matters anyway.",d:"30 min"},biking:{t:"Letter Drop",b:"Write an encouraging note. Leave it for a stranger. Your words outlast the ride.",d:"25 min"},yoga:{t:"Intention Setting",b:"Write a legacy intention. Bury it in the earth. Let it grow roots you\u2019ll never see.",d:"15 min"}},journalPrompt:"What cycle am I breaking? What will outlast me?",reflection:"If my grandchildren read this journal, what would I want them to know?",prayer:"God, let my healing ripple through generations I\u2019ll never meet. Amen.",tags:["Legacy","Generational Healing"]},
{day:26,week:4,title:"The Ministry of Presence",verse:"Mourn with those who mourn.",ref:"Romans 12:15",teaching:"The most powerful thing you can offer is presence. Not advice. Just being there.\n\nThis is Walk and Talk therapy at its core.",ex:{walking:{t:"Presence Walk",b:"Walk near people. Don\u2019t engage. Just be present. Pray silently for the ones you pass.",d:"20 min"},hiking:{t:"Sit with Creation",b:"Find a living thing. Sit with it twenty minutes. Don\u2019t analyze. Just be present.",d:"20 min"},biking:{t:"Ride-Along Ministry",b:"Ride alongside someone slower. Match their pace. Ministry is meeting people where they are.",d:"20 min"},yoga:{t:"Partner Breathing",b:"Back-to-back. Synchronize breathing. No words. Just presence.",d:"15 min"}},journalPrompt:"Who needs my presence more than my advice?",reflection:"When someone hurts, do I fix or sit?",prayer:"Jesus, You chose presence before power. Teach me that. Amen.",tags:["Presence","Empathy"]},
{day:27,week:4,title:"Peace That Passes Understanding",verse:"The peace of God will guard your hearts and minds.",ref:"Philippians 4:7",teaching:"This isn\u2019t peace that makes sense. It\u2019s peace that defies sense. Not because the storm stopped\u2014because something inside you shifted.",ex:{walking:{t:"Storm Walk",b:"Walk in challenging weather. Find stillness inside regardless of conditions.",d:"15 min"},hiking:{t:"Exposed Ridge",b:"Stand in the wind on an exposed ridge. Don\u2019t brace. Find your center.",d:"30 min"},biking:{t:"Headwind Peace",b:"Ride into a headwind. Find a sustainable gear. That\u2019s peace in adversity.",d:"20 min"},yoga:{t:"Balance in Chaos",b:"Tree Pose, eyes closed. Find balance through internal peace, not external stability.",d:"10 min"}},journalPrompt:"When have I felt peace that didn\u2019t make logical sense?",reflection:"Is peace the absence of problems or God\u2019s presence in them?",prayer:"God, calm me in every storm. Give me the peace that guards my heart. Amen.",tags:["Peace","Trust"]},
{day:28,week:4,title:"Rooted and Established",verse:"Rooted and built up in him, overflowing with thankfulness.",ref:"Colossians 2:6\u20137",teaching:"Four weeks. You showed up. Today you stand tall\u2014not arrogantly, but firmly.\n\nBring your complete journal to Michelle. Walk her through the whole journey. You deserve a witness to your own growth.",ex:{walking:{t:"Stand Like a Tree",b:"Find the largest tree. Put your hand on its trunk. It survived storms. So did you.",d:"Free"},hiking:{t:"Old Growth Visit",b:"Find the oldest tree you can reach. Sit with it. Some things endure.",d:"Free"},biking:{t:"Victory Lap",b:"Favorite route as celebration. Not training. Celebrating twenty-eight days of showing up.",d:"Free"},yoga:{t:"Full Practice",b:"Your complete practice. Every pose, every breath pattern. This is yours now.",d:"Free"}},journalPrompt:"Write a letter to yourself from one year in the future.",reflection:"What does it feel like to be rooted versus stuck?",prayer:"Lord, I am rooted in You. Keep me here. Amen.",tags:["Rooted","Strength"]},
